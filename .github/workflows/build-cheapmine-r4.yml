name: Cheapmine 3 R4 IPA

on:
  push:
    branches: [build-r4-control]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Load exact reviewed source commit
        shell: bash
        run: |
          set -euo pipefail
          echo 'ae3bc487b43e532b02daf6f4a6f9cb226851d3cff8d3d6b89ba504a1274a55e2  cheapmine-3-r4-source.bundle' | shasum -a 256 -c -
          cp cheapmine-3-r4-source.bundle "$RUNNER_TEMP/package-source.bundle"
          git bundle verify cheapmine-3-r4-source.bundle
          git fetch ./cheapmine-3-r4-source.bundle refs/heads/cheapmine-3-r4
          test "$(git rev-parse FETCH_HEAD)" = 'd778235f5ba4114380bd91282d2d23d288034cab'
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive
      - name: Publish corresponding source branch
        run: git push origin HEAD:refs/heads/cheapmine-3-r4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: latest-stable
      - name: Validate restart routing and cleanup handoff
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-screen-restart.sh
          python3 BaseBin/systemhook/tests/test_package_restart.py
          python3 BaseBin/jbctl/tests/test_restart_guards.py
          python3 Application/tests/test_jbctl_handoff.py
          python3 Application/tests/test_jbctl_reader.py
      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          # Dopamine uses -s on an app bundle, supported by Procursus ldid.
          if brew list --versions ldid >/dev/null; then
            brew uninstall --ignore-dependencies ldid
          fi
          brew install ldid-procursus dpkg make libarchive openssl@3 xz zstd gnu-sed coreutils findutils
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Install pinned Theos and SDK
        shell: bash
        run: |
          set -euo pipefail
          export THEOS="$RUNNER_TEMP/theos"
          git clone https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout dd5c14bb9d91311e221d51b5bfb8c9e5948156db
          git -C "$THEOS" submodule update --init --recursive
          mkdir -p "$THEOS/sdks"
          curl -fL --retry 3 https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz -o "$RUNNER_TEMP/iphone-sdk.tar.xz"
          tar -xJf "$RUNNER_TEMP/iphone-sdk.tar.xz" -C "$THEOS/sdks"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
      - name: Build pinned trustcache utility
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/CRKatri/trustcache "$RUNNER_TEMP/trustcache"
          cd "$RUNNER_TEMP/trustcache"
          git checkout aa0e8847529cf76576fce8d2dbc9e088c8f1a0df
          export CFLAGS="-I$(brew --prefix openssl@3)/include"
          export LDFLAGS="-L$(brew --prefix openssl@3)/lib"
          gmake -j2 OPENSSL=1
          echo "$RUNNER_TEMP/trustcache" >> "$GITHUB_PATH"
      - name: Compile and verify IPA
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-package-ipa.sh
          python3 scripts/package-public-release.py .build/public-release
      - name: Upload IPA and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Cheapmine-3-R4-iPhone8Plus-20H350
          path: .build/public-release/
          if-no-files-found: error
          retention-days: 30
      - name: Publish IPA for sideloading
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create cheapmine-3-r4 \
            --target d778235f5ba4114380bd91282d2d23d288034cab --prerelease \
            --title 'Cheapmine 3 — R4' \
            --notes-file RELEASE.md .build/public-release/*
      - name: Retire failed experimental publications
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for tag in fresh-1-1 fresh-2-1; do
            gh release delete "$tag" --cleanup-tag --yes
          done
          for branch in fresh-build-control fresh2-build-control; do
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch"
          done
          for run in 37650764220 37654217043; do
            gh api --method DELETE "repos/$GH_REPO/actions/runs/$run"
          done
