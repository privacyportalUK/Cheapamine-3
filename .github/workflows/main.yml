name: Cheapamine 3 experimental IPA

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cheapamine3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Apply and test the source port
        shell: bash
        run: |
          set -euo pipefail
          if git apply --reverse --check cheapamine3.patch 2>/dev/null; then
            echo 'Source port already applied.'
          else
            git apply --check cheapamine3.patch
            git apply --index cheapamine3.patch
          fi
          bash scripts/test-screen-restart.sh
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Port Cheapamine selective restart to Dopamine 3.0.10'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: latest-stable
      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          # Dopamine uses -s on an app bundle, supported by Procursus ldid.
          if brew list --versions ldid >/dev/null; then
            brew uninstall --ignore-dependencies ldid
          fi
          brew install ldid-procursus dpkg make libarchive openssl@3 xz zstd gnu-sed coreutils findutils
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Install pinned Theos and SDK
        shell: bash
        run: |
          set -euo pipefail
          export THEOS="$RUNNER_TEMP/theos"
          git clone https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout dd5c14bb9d91311e221d51b5bfb8c9e5948156db
          git -C "$THEOS" submodule update --init --recursive
          mkdir -p "$THEOS/sdks"
          curl -fL --retry 3 https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz -o "$RUNNER_TEMP/iphone-sdk.tar.xz"
          tar -xJf "$RUNNER_TEMP/iphone-sdk.tar.xz" -C "$THEOS/sdks"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
      - name: Build pinned trustcache utility
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/CRKatri/trustcache "$RUNNER_TEMP/trustcache"
          cd "$RUNNER_TEMP/trustcache"
          git checkout aa0e8847529cf76576fce8d2dbc9e088c8f1a0df
          export CFLAGS="-I$(brew --prefix openssl@3)/include"
          export LDFLAGS="-L$(brew --prefix openssl@3)/lib"
          gmake -j2 OPENSSL=1
          echo "$RUNNER_TEMP/trustcache" >> "$GITHUB_PATH"
      - name: Compile and package IPA
        shell: bash
        run: bash scripts/build-screen-ipa.sh
      - name: Upload IPA and verification details
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Cheapamine3-iPhone8Plus-iOS16.7.10-experimental
          path: .build/artifacts/
          if-no-files-found: error
          retention-days: 30
